[project]
name = "agents-prisma"
version = "0.1.0"
description = "Multi-agent system for PRISMA systematic review pipeline using CrewAI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Roger Rox", email = "rogerroxbr@gmail.com"},
]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "langchain-core>=0.1",
    "langgraph>=0.0.30",
    "langgraph-checkpoint-postgres>=2.0.0",
    "markitdown>=0.1.6",
    "langchain-openai>=1.3.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest-mock>=3.14",
    "black>=24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
]

[project.scripts]
prisma-run = "src.agents.main:main"
prisma-searcher = "src.agents.searcher:SearcherAgent"
prisma-screener = "src.agents.screener:ScreeningAgent"
